name: Build Mihomo iOS Core

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build XCFramework
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Download modules
        run: go mod download

      - name: Test wrapper
        run: go test ./mihomocore

      - name: Build XCFramework
        run: |
          mkdir -p build
          gomobile bind -v -target=ios,iossimulator -prefix=MihomoCore -o build/MihomoCore.xcframework ./mihomocore

      - name: Package artifact
        run: |
          cd build
          zip -ry MihomoCore.xcframework.zip MihomoCore.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MihomoCore.xcframework
          path: build/MihomoCore.xcframework.zip
          if-no-files-found: error

